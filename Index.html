<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IBIC T20 Game - HD</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto; background:linear-gradient(135deg,#0f172a,#1e293b); color:white; min-height:100vh; padding:16px}
.card{max-width:480px;margin:auto;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border-radius:24px;padding:20px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
h1{text-align:center;font-size:28px;font-weight:900;letter-spacing:-1px;margin-bottom:4px}
.sub{text-align:center;opacity:0.6;font-size:13px;margin-bottom:18px}
.diagram{background:white;border-radius:18px;padding:12px;margin-bottom:14px}
.diagram svg{width:100%;height:auto;display:block}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:white;color:#0f172a;border-radius:14px;padding:14px;text-align:center;font-weight:800;font-size:16px;cursor:pointer;transition:0.2s;border:2px solid transparent}
.opt:hover{transform:scale(1.03);border-color:#38bdf8}
.opt.correct{background:#22c55e;color:white}
.opt.wrong{background:#ef4444;color:white}
.bags{display:flex;gap:8px;justify-content:center;margin:12px 0}
.bag{width:60px;height:70px;background:linear-gradient(#fde68a,#f59e0b);border-radius:8px 8px 4px 4px;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;color:#78350f;border:2px solid #78350f}
.result{text-align:center;margin-top:14px;padding:12px;border-radius:12px;font-weight:700;display:none}
.btn{width:100%;margin-top:12px;background:#38bdf8;color:#0f172a;border:none;padding:14px;border-radius:12px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<div class="card">
<h1>IBIC T20</h1>
<div class="sub">HD Clear • Tap the correct option</div>

<div class="diagram">
<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="200" cy="110" rx="190" ry="100" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <rect x="175" y="85" width="50" height="50" rx="4" fill="#fde68a" stroke="#a16207" stroke-width="2"/>
  <circle cx="200" cy="110" r="4" fill="#dc2626"/>
  <text x="200" y="30" text-anchor="middle" font-size="11" font-weight="800" fill="#166534">T20 FIELD - TOP VIEW</text>
  <circle cx="100" cy="80" r="12" fill="#3b82f6" opacity="0.8"/><text x="100" y="84" text-anchor="middle" font-size="9" fill="white" font-weight="700">A</text>
  <circle cx="300" cy="80" r="12" fill="#3b82f6" opacity="0.8"/><text x="300" y="84" text-anchor="middle" font-size="9" fill="white" font-weight="700">B</text>
  <circle cx="100" cy="150" r="12" fill="#3b82f6" opacity="0.8"/><text x="100" y="154" text-anchor="middle" font-size="9" fill="white" font-weight="700">C</text>
  <circle cx="300" cy="150" r="12" fill="#3b82f6" opacity="0.8"/><text x="300" y="154" text-anchor="middle" font-size="9" fill="white" font-weight="700">D</text>
</svg>
</div>

<div class="bags">
<div class="bag">BAG 1</div>
<div class="bag">BAG 2</div>
<div class="bag">BAG 3</div>
</div>

<div class="options">
<div class="opt" onclick="check(this,'A')">A) TOP</div>
<div class="opt" onclick="check(this,'B')">B) BAGS</div>
<div class="opt" onclick="check(this,'C')">C) LEFT</div>
<div class="opt" onclick="check(this,'D')">D) RIGHT</div>
</div>

<div id="result" class="result"></div>
<button class="btn" onclick="resetGame()">Play Again</button>
</div>

<script>
let answer = 'A';
function check(el,choice){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  const res=document.getElementById('result');
  res.style.display='block';
  if(choice===answer){
    el.classList.add('correct');
    res.style.background='#22c55e';
    res.innerText='✅ CORRECT! HD T20 Top is Answer';
  }else{
    el.classList.add('wrong');
    res.style.background='#ef4444';
    res.innerText='❌ Wrong! Correct is A) TOP';
  }
}
function resetGame(){
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','wrong'));
  document.getElementById('result').style.display='none';
  const opts=['A','B','C','D'];
  answer=opts[Math.floor(Math.random()*4)];
}
</script>
</body>
</html>
