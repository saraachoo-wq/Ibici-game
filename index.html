<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBIC Ecolier 2023 - All 21 Questions HD Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#080c18;color:#fff;min-height:100vh;display:flex;justify-content:center;padding:10px}
.app{width:100%;max-width:580px}
.hd{text-align:center;padding:14px 0}
.hd h1{font-size:24px;font-weight:900;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.pill{background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.4);color:#7dd3fc;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.barW{height:6px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:12px 0}
.bar{height:100%;background:linear-gradient(90deg,#38bdf8,#22c55e);width:0%;transition:0.35s}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;overflow:hidden}
.qHead{background:#fff;color:#0f172a;padding:12px 14px}
.qHead .cat{font-size:10px;font-weight:800;color:#fff;background:#0f172a;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:4px}
.qHead .title{font-size:14px;font-weight:900;line-height:1.3}
.qHead .desc{font-size:11.5px;line-height:1.45;margin-top:6px;opacity:0.9;white-space:pre-wrap}
.body{padding:12px}
.q{font-size:13px;font-weight:800;margin-bottom:2px}
.hint{font-size:10px;opacity:0.5;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#fff;color:#0f172a;padding:11px 8px;border-radius:11px;text-align:center;font-weight:800;font-size:12px;cursor:pointer;border:2.5px solid transparent;line-height:1.2}
.opt.correct{background:#22c55e;color:#fff;border-color:#16a34a}
.opt.wrong{background:#ef4444;color:#fff;border-color:#dc2626}
.next{width:100%;margin-top:10px;background:#38bdf8;color:#0f172a;border:none;padding:12px;border-radius:11px;font-weight:900;font-size:14px;display:none}
.foot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;opacity:0.6}
</style>
</head>
<body>
<div class="app">
<div class="hd">
<h1>🦫 IBIC ECOLIER 2023 • ALL 21 Q</h1>
<div class="pills">
<span class="pill">3 POINTS: T1-T7</span>
<span class="pill">4 POINTS: T8-T14</span>
<span class="pill">5 POINTS: T15-T21</span>
</div>
<div class="barW"><div id="bar" class="bar"></div></div>
</div>
<div id="game" class="card">
<div class="qHead" id="qHead"></div>
<div class="body">
<div id="qText" class="q"></div>
<div id="hint" class="hint"></div>
<div id="opts" class="grid"></div>
<div class="foot"><span id="cnt"></span><span id="score"></span></div>
<button id="next" class="next" onclick="nextQ()">Next →</button>
</div>
</div>
</div>
<script>
const ALL=[
{cat:"T1 • 3 pts • Fair Animals",title:"Haley hare, Steve skunk, Paul pig, Olivia owl share 12 houses. ? house left. Rule: neighboring houses cannot be same animal. Each must have 3 houses.",q:"Which animal should be assigned to remaining house ?",opts:["Haley hare","Steve skunk","Paul pig","Olivia owl"],ans:1,hint:"Count houses, use adjacency"},
{cat:"T2 • 3 pts • Beads Stringing",title:"Emma and Olivia make beaded necklace. Emma from left, Olivia from right, same time. Emma slower: Olivia strings 2 while Emma strings 1.",q:"How must beads be organised on Emma's support for fastest finish ?",opts:["Pattern A","Pattern B","Pattern C","Pattern D"],ans:2,hint:"Speed ratio 1:2"},
{cat:"T3 • 3 pts • Symmetry",title:"Beaver teacher drew half design on board, wants class to complete to make symmetric intended design.",q:"Which piece did students add ?",opts:["Piece A","Piece B","Piece C","Piece D"],ans:0,hint:"Mirror symmetry"},
{cat:"T4 • 3 pts • Umbrella",title:"Anna's umbrella shown from top. 4 images show umbrellas from different angles.",q:"Which one is Anna's umbrella ?",opts:["Image A","Image B","Image C","Image D"],ans:2,hint:"Rotation matching"},
{cat:"T5 • 3 pts • Farm",title:"Little Marko walked on farm, grandpa drew exact walking path. Path shows order of animals seen.",q:"Which sentence is FALSE? A) Cat last B) Goat first C) Donkey second D) After rooster saw sheep",opts:["A is false","B is false","C is false","D is false"],ans:0,hint:"Follow path"},
{cat:"T6 • 3 pts • Coded Ages",title:"Zita shows cards: Zita 6 uses 4+2=6. Silat 7 uses 4+2+1=7. Binary!",q:"Kali is 9. What cards will she use ?",opts:["8+1","4+2+1","4+1","8+2"],ans:0,hint:"9=8+1 binary"},
{cat:"T7 • 3 pts • Reaching Circle",title:"Four beavers Red, Yellow, Green, Blue go only direction indicated by arrows.",q:"How many beavers will reach circle coloured with their team colour ?",opts:["none","1","3","4"],ans:2,hint:"Trace arrows"},
{cat:"T8 • 4 pts • Flower Garden",title:"Beaver Bevy divides garden into triangles: Choose 3 consecutive posts connect first-last with rope. Repeat until triangles.",q:"For given garden shape, how many triangles ?",opts:["3","7","8","9"],ans:2,hint:"Triangulation n-2"},
{cat:"T9 • 4 pts • Organizing Balls",title:"Sarah has 9 balls of 3 styles in one big container, wants each style in separate storage. Takes one by one.",q:"Which storage will Sarah fill first ?",opts:["Storage A","Storage B","Storage C","Storage D"],ans:0,hint:"Sequence order"},
{cat:"T10 • 4 pts • Classifying Beavers",title:"Trainer must choose representatives. Data: Age, Height, Weight, Photo. Medals in Photo column are winners.",q:"Which property helped win ?",opts:["Age","Height","Weight","Height or Weight"],ans:2,hint:"Find correlation"},
{cat:"T11 • 4 pts • Theater",title:"Five friends sat row 1-5 left to right. Cindy < Dave, Bob < Cindy, Alice < Bob, Dave < Ellen.",q:"Who sat in seat 3 ?",opts:["Alice","Bob","Cindy","Dave"],ans:2,hint:"Order: Alice<Bob<Cindy<Dave<Ellen"},
{cat:"T12 • 4 pts • Eric's New House",title:"Beaver Eric builds house, needs shapes from store. Prices: 4,2,1,3,2,5 beaver-coins.",q:"Which house design costs least ?",opts:["Design A","Design B","Design C","Design D"],ans:1,hint:"Calculate sum"},
{cat:"T13 • 4 pts • Ordered Cards",title:"Cards should be in order Dan, Mary, John, Ann arrived. Two pupils interchanged. Mary last.",q:"In what order did four children arrive ?",opts:["John,Ann,Dan,Mary","Ann,John,Dan,Mary","Dan,Ann,John,Mary","Dan,John,Ann,Mary"],ans:1,hint:"Swap logic"},
{cat:"T14 • 4 pts • Buildings - Tiling",title:"Adam covers board with tiles of two L shapes. No overlaps, no gaps.",q:"Which board could be tiled ?",opts:["Board A","Board B","Board C","Board D"],ans:2,hint:"Area check"},
{cat:"T15 • 5 pts • Turtle Bug",title:"Turtle robot from square 8 to beaver in square 1. Instructions: ↑ Forward, ↓ Backward, Turn Left, Turn Right. Program ↑, Left, ↑, ↑ failed.",q:"Which instruction needs change to reach beaver ?",opts:["First ↑ to ↓","Change Left to Right","Second ↑ to ↓","Second ↑ to Right"],ans:1,hint:"Orientation"},
{cat:"T16 • 5 pts • Graphics",title:"Hale remakes low quality logo with points and lines. Want fewest points.",q:"Minimum points needed ?",opts:["15","19","21","22"],ans:1,hint:"Count vertices"},
{cat:"T17 • 5 pts • Travel by Coin",title:"Flipper jumps stepping stone by coin H/T. Start -> H to 1, T to 2. Each stone has H/T instructions.",q:"Which coin sequence results in 'finish' ?",opts:["TTHTHHT","HTHHHT","TTTHTTHH","THTTHTTHT"],ans:0,hint:"Trace decision tree"},
{cat:"T18 • 5 pts • Applique",title:"Elephant 25 squares 5x5, flower 9 squares 3x3. Elephants first as many as possible, then flowers. No overlap.",q:"Maximum total shapes on two fabrics ?",opts:["8 (3e+5f)","10 (4e+6f)","9 (3e+6f)","10 (3e+7f)"],ans:1,hint:"Packing"},
{cat:"T19 • 5 pts • Chain Coding",title:"Beavers mark borders with chain coding. Walk around border, write direction 0-7 to next square. Example: 1,0,0,7,7,5,5,4,3,3,2",q:"Starting at blue outline, which chain code represents border ?",opts:["1,1,0,0,7,7,6,6...","6,7,7,7,0,1,1,1...","1,1,1,0,7,7,7,6...","0,1,1,0,7,7,7,6..."],ans:2,hint:"Follow border"},
{cat:"T20 • 5 pts • Airport Luggage",title:"Bebrasland airport: 3 check-in counters, vertical lanes feed horizontal lane. Bags placed one at a time.",q:"Which order possible on horizontal lane ?",opts:["Order A","Order B","Order C","Order D"],ans:1,hint:"Interleaving queues"},
{cat:"T21 • 5 pts • Favourite Drinks",title:"Dag, Norb, Jack each have 3 favourites from 9 drinks. Monday Dag+Norb: 1,2,3,5,8,9. Tuesday Norb+Jack: 1,4,5,6,7,9.",q:"Which drinks are Dag's favourites ?",opts:["1,2,3","2,3,9","1,2,5","2,3,8"],ans:3,hint:"Dag = Monday minus common"}
];
let idx=0,score=0,lock=false;
const qHead=document.getElementById('qHead'),qText=document.getElementById('qText'),hint=document.getElementById('hint'),opts=document.getElementById('opts'),cnt=document.getElementById('cnt'),sc=document.getElementById('score'),bar=document.getElementById('bar'),next=document.getElementById('next'),game=document.getElementById('game');
function load(){lock=false;next.style.display='none';const q=ALL[idx];qHead.innerHTML=`<div class='cat'>${q.cat}</div><div class='title'>${q.title}</div><div class='desc'>${q.q}</div>`;qText.innerText=`Question ${idx+1} of 21`;hint.innerText=`Hint: ${q.hint}`;cnt.innerText=`${idx+1}/21`;sc.innerText=`Score ${score}`;bar.style.width=(idx/ALL.length*100)+'%';opts.innerHTML='';q.opts.forEach((o,j)=>{const d=document.createElement('div');d.className='opt';d.innerText=o;d.onclick=()=>check(j,d);opts.appendChild(d);});}
function check(j,el){if(lock)return;lock=true;if(j===ALL[idx].ans){el.classList.add('correct');score++;}else{el.classList.add('wrong');opts.children[ALL[idx].ans].classList.add('correct');}sc.innerText=`Score ${score}`;next.style.display='block';if(idx===ALL.length-1)next.innerText='See Final Result 🎉';}
function nextQ(){idx++;if(idx<ALL.length)load();else{bar.style.width='100%';let msg=score>=18?'Beaver Genius! 🦫🏆':score>=14?'Excellent! 🌟':score>=10?'Good Job!':'Keep Practicing 💪';game.innerHTML=`<div style='text-align:center;padding:30px 16px'><div style='font-size:12px;opacity:0.6'>IBIC ECOLIER 2023 COMPLETE</div><h2 style='font-size:56px;margin:10px 0'>${score}/21</h2><p style='font-size:18px;font-weight:800'>${msg}</p><p style='font-size:11px;opacity:0.5;margin-top:8px'>3pts Q1-7 | 4pts Q8-14 | 5pts Q15-21 | Max: 84 pts</p><button class='next' style='display:block;margin-top:16px' onclick='location.reload()'>Play Again All 21</button></div>`;}}
load();
</script>
</body>
</html>
